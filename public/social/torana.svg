<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>A programmable proxy for coding agents.</title>
  <rect width="1200" height="630" fill="#09171c"/>
  <g font-family="Arial, sans-serif">
    <text x="72" y="100" font-size="32" font-weight="700" fill="#2dd4bf">Torana</text>
    <text x="72" y="265" font-size="68" font-weight="700" letter-spacing="-2" fill="#e8f1f2">A programmable proxy</text>
    <text x="72" y="345" font-size="68" font-weight="700" letter-spacing="-2" fill="#e8f1f2">for coding agents.</text>
    <text x="72" y="430" font-size="27" fill="#b5c5ca">Local-first. Open source. Yours to extend.</text>
    <path d="M72 525H1128" stroke="#384d54"/>
    <text x="72" y="573" font-size="23" fill="#b5c5ca">torana.sh</text>
    <text x="1128" y="573" text-anchor="end" font-size="23" fill="#2dd4bf">agent → proxy → provider</text>
  </g>
</svg>

